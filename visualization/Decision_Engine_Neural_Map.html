<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* standalone reset (matches the artifact host skeleton) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Decision Engine Neural Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400;1,8..60,500&display=swap">
<style>
:root{
  /* Layout: one-screen app. Header / stage (pan-zoom SVG map + inspector) / step ribbon.
     Layers run left to right like a feed-forward net; G0–G9 form the vertical spine. */
  --bg:#E5EAEE;
  --surface:#F8FAFB;
  --surface-2:#EEF2F5;
  --ink:#0F1820;
  --ink-2:#425367;
  --ink-3:#768596;
  --line:#C7D0D9;
  --wire:#3F5269;
  --wire-o:.15;
  --grid:#C9D2DA;
  --signal:#2744CF;
  --c-in:#08717D;
  --c-div:#A85F00;
  --c-core:#394A5E;
  --c-sop:#76439A;
  --go:#16704A;
  --stop:#BA2D18;
  --hold:#3B6183;
  --glow:none;
  --shadow:0 10px 30px rgba(20,34,52,.12);
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F15; --surface:#111921; --surface-2:#0D141B; --ink:#E2E8EE; --ink-2:#9DABBA; --ink-3:#64727F;
    --line:#24303C; --wire:#93A6BC; --wire-o:.13; --grid:#1A242E;
    --signal:#8297FF; --c-in:#3CBFC8; --c-div:#EFA03A; --c-core:#AFBCCB; --c-sop:#C79DE6;
    --go:#45C88E; --stop:#FF6F58; --hold:#8FB4D7;
    --glow:drop-shadow(0 0 3px rgba(130,151,255,.75));
    --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F15; --surface:#111921; --surface-2:#0D141B; --ink:#E2E8EE; --ink-2:#9DABBA; --ink-3:#64727F;
  --line:#24303C; --wire:#93A6BC; --wire-o:.13; --grid:#1A242E;
  --signal:#8297FF; --c-in:#3CBFC8; --c-div:#EFA03A; --c-core:#AFBCCB; --c-sop:#C79DE6;
  --go:#45C88E; --stop:#FF6F58; --hold:#8FB4D7;
  --glow:drop-shadow(0 0 3px rgba(130,151,255,.75));
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:16px;padding-block:10px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;min-width:0}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font-family:var(--font-display);font-stretch:118%;font-weight:780;font-size:21px;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.brand h1 span{font-weight:420;color:var(--ink-2)}
.brand .meta{margin:3px 0 0;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow-x:auto;max-width:100%}
.modes button{border:0;background:transparent;padding:6px 12px;border-radius:5px;font-weight:560;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.modes button:hover:not([aria-selected="true"]){background:var(--surface-2);color:var(--ink)}
.tools{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:560;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.4;cursor:default}

/* stage */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:10px;min-height:0}
.stage.collapsed{grid-template-columns:minmax(0,1fr)}
.stage.collapsed .drawer{display:none}
.mapwrap{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.grabbing{cursor:grabbing}
.mapctl{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px}
.mapctl .btn{padding:4px 9px;font-family:var(--font-mono);font-size:12px}
.hint{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);background:color-mix(in srgb,var(--surface-2) 85%,transparent);padding:2px 6px;border-radius:4px}
.tip{position:absolute;pointer-events:none;max-width:260px;padding:7px 9px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;box-shadow:var(--shadow);z-index:3}
.tip b{display:block;font-weight:650}
.tip span{font-family:var(--font-mono);font-size:10px;opacity:.75}

/* drawer */
.drawer{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);overscroll-behavior:contain}
.sheetbar{display:none}
.dz{padding:18px 20px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dz h2{margin:0;font-family:var(--font-display);font-stretch:108%;font-size:20px;font-weight:720;line-height:1.2;letter-spacing:-.005em;text-wrap:balance}
.dz h3{margin:8px 0 0;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.dz p{margin:0;max-width:65ch;color:var(--ink-2)}
.dz p strong{color:var(--ink)}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow b{color:var(--lc,var(--signal));font-weight:600}
.quote{margin:0;padding:12px 14px;background:var(--surface-2);border-radius:6px}
.quote figcaption{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.quote blockquote{margin:0;font-family:var(--font-serif);font-style:italic;font-size:15.5px;line-height:1.45;color:var(--ink)}
.formula{font-family:var(--font-mono);font-size:11.5px;line-height:1.7;color:var(--ink);padding:10px 12px;border:1px dashed var(--line);border-radius:6px}
.stoprule{padding:9px 12px;border:1.5px solid var(--stop);border-radius:6px;font-weight:600;color:var(--ink)}
.stoprule span{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--stop);margin-bottom:2px}
.stoprule.cond{border-color:var(--c-div)}
.stoprule.cond span{color:var(--c-div)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
dl.facts{margin:0;display:grid;gap:9px}
dl.facts div{display:grid;gap:2px}
dl.facts dt{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
dl.facts dd{margin:0;color:var(--ink-2)}
ul.plain{margin:0;padding-left:18px;color:var(--ink-2);display:grid;gap:3px}
ul.plain li::marker{color:var(--ink-3)}
.links{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:start}
.lrow .why{grid-column:1 / -1;font-size:12px;color:var(--ink-3);line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 8px;font-size:12.5px;cursor:pointer;max-width:100%;text-align:left}
.chip:hover{border-color:var(--ink-3)}
.chip code{font-family:var(--font-mono);font-size:10.5px;color:var(--lc,var(--ink-3))}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--lc,var(--ink-3));flex:none}
.tag{justify-self:start;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--ink-3);align-self:center}
.tag.s{color:var(--ink-2);border-color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.navrow .btns{display:flex;gap:6px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.primary:hover{opacity:.9}
.fine{font-size:12px!important;color:var(--ink-3)!important;line-height:1.45}
.key{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.key li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;color:var(--ink-2);font-size:13px}
.key svg{width:44px;height:16px;overflow:visible}
.swatches{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink-2)}
.swatches span{display:inline-flex;align-items:center;gap:6px}
.swatches i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--lc);background:color-mix(in srgb,var(--lc) 16%,var(--surface))}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);word-break:break-word}

/* calculator */
.calc{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px}
.calc .inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc label{display:grid;gap:3px;font-size:11px;color:var(--ink-3);font-family:var(--font-mono);letter-spacing:.02em}
.calc input{width:100%;min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink);font:500 13px var(--font-mono);font-variant-numeric:tabular-nums}
.calc dl{margin:0;display:grid;gap:5px}
.calc dl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.calc dt{color:var(--ink-2);font-size:12.5px}
.calc dd{margin:0;font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.calc .neg{color:var(--stop)} .calc .pos{color:var(--go)}

/* run console */
.result{display:grid;gap:8px;padding:14px;border-radius:8px;border:1.5px solid var(--dc,var(--line));background:color-mix(in srgb,var(--dc,var(--ink-3)) 7%,var(--surface))}
.verdict{font-family:var(--font-display);font-stretch:112%;font-weight:780;font-size:26px;line-height:1;color:var(--dc)}
.d-deploy{--dc:var(--go)} .d-defer{--dc:var(--c-div)} .d-reject{--dc:var(--stop)} .d-preserve{--dc:var(--hold)}
.reasons{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--ink)}
.reasons small{display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);letter-spacing:.03em}
.prio{font-size:12.5px;color:var(--ink-2)}
.prio b{color:var(--ink)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 8px;font-size:12px;cursor:pointer;text-align:left;line-height:1.3}
.presets button:hover{border-color:var(--ink-3)}
.presets button[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
form.run{display:grid;gap:10px;margin:0}
form.run fieldset{border:0;margin:0;padding:0;display:grid;gap:4px;min-width:0}
form.run legend{padding:0;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-2);margin-bottom:4px}
.seg{position:relative;display:flex;flex-wrap:wrap;gap:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--ink-2)}
.seg input:checked + label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible + label{outline:2px solid var(--signal);outline-offset:2px}
.seg input:disabled + label{opacity:.4;cursor:not-allowed}

/* ribbon */
.ribbon{display:flex;align-items:center;gap:10px;min-width:0}
.ribbon .lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.steps{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin;padding-bottom:2px}
.steps button{flex:none;display:flex;align-items:baseline;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.steps button b{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);font-weight:600}
.steps button.g b{color:var(--signal)}
.steps button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps button[aria-current="step"] b{color:var(--bg);opacity:.75}
.play{min-width:64px}

/* ---- SVG ---- */
:where(#map) text{font-family:var(--font-body);fill:var(--ink)}
.griddot{fill:var(--grid)}
.layerhead .num{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:var(--signal)}
.layerhead .name{font-family:var(--font-display);font-stretch:112%;font-size:15px;font-weight:740;letter-spacing:.01em}
.layerhead .what{font-family:var(--font-mono);font-size:9.5px;fill:var(--ink-3);letter-spacing:.03em}
.grouphead{font-family:var(--font-mono)!important;font-size:8.8px;font-weight:600;letter-spacing:.09em;fill:var(--ink-3)!important;text-transform:uppercase}
.edge{fill:none;stroke:var(--wire);stroke-opacity:var(--wire-o);stroke-linecap:round;transition:stroke-opacity .18s}
.edge.interp{stroke-dasharray:3 3.5}
.edge.spine{stroke:var(--ink);stroke-opacity:.55}
.edge.lane{stroke:var(--ink-2);stroke-opacity:.5;stroke-dasharray:5 4}
.edge.hot{stroke:var(--signal);filter:var(--glow)}
.edge.r-pass{stroke:var(--go);stroke-opacity:.9}
.edge.r-cond{stroke:var(--ink-3);stroke-opacity:.7;stroke-dasharray:2 4}
.edge.r-out{stroke:var(--dc);stroke-opacity:.95;stroke-width:2.4px}
.arrowhead{fill:var(--ink-2)}
.tick{stroke:var(--c-core);stroke-opacity:.35;stroke-width:1}
.node{cursor:pointer;transition:opacity .18s}
.node.dim{opacity:.2}
.node .body{fill:var(--surface);stroke:var(--lc);stroke-width:1;transition:fill .18s,stroke-width .18s}
.node .code{font-family:var(--font-mono)!important;font-size:9.4px;font-weight:500;fill:var(--lc)!important}
.node .lbl{font-size:11px;font-stretch:86%;font-weight:520}
.node .sub{font-family:var(--font-mono)!important;font-size:8.4px;fill:var(--ink-3)!important}
.node .port{fill:var(--lc)}
.node.lit .body{fill:color-mix(in srgb,var(--lc) 14%,var(--surface));stroke-width:1.7}
.node.half .body{fill:color-mix(in srgb,var(--lc) 6%,var(--surface))}
.node.sel .body{stroke:var(--signal);stroke-width:2.2}
.node:focus{outline:none}
.node:focus-visible .body{stroke:var(--signal);stroke-width:2.4}
.L-in{--lc:var(--c-in)} .L-det,.L-inv,.L-cell{--lc:var(--c-div)} .L-core{--lc:var(--c-core)} .L-sop{--lc:var(--c-sop)}
.L-gate{--lc:var(--ink)} .L-role,.L-lane,.L-prio{--lc:var(--ink-2)} .L-bus{--lc:var(--c-core)}
.L-dec.k-deploy{--lc:var(--go)} .L-dec.k-defer{--lc:var(--c-div)} .L-dec.k-reject{--lc:var(--stop)} .L-dec.k-preserve{--lc:var(--hold)}
.boxhead{font-family:var(--font-display);font-stretch:104%;font-size:13px;font-weight:720}
.axis{font-family:var(--font-mono)!important;font-size:8.4px;fill:var(--ink-3)!important;letter-spacing:.04em}
.node.L-cell .lbl{font-size:10.4px}
.gate .tab{fill:var(--ink)}
.gate .gcode{font-family:var(--font-mono)!important;font-size:14px;font-weight:600;fill:var(--bg)!important}
.gate .glbl{font-size:12px;font-stretch:90%;font-weight:640}
.gate .gbadge{font-family:var(--font-mono)!important;font-size:8.4px;font-weight:600;letter-spacing:.06em;fill:var(--ink-3)!important}
.gate .gbadge.stopb{fill:var(--stop)!important}
.gate .watch{fill:var(--c-div)}
.node.gate .body{stroke-width:1.4}
.dec .neuron{fill:color-mix(in srgb,var(--lc) 18%,var(--surface));stroke:var(--lc);stroke-width:1.6}
.dec .core{fill:var(--lc);opacity:.0;transition:opacity .2s}
.dec .dlbl{font-family:var(--font-display);font-stretch:108%;font-size:13.5px;font-weight:720}
.dec .body{fill:transparent;stroke:none}
.node.dec.lit .core,.node.dec.on .core{opacity:1}
.node.dec.lit .body{fill:transparent}
.node.L-bus .body{fill:color-mix(in srgb,var(--c-core) 10%,var(--surface));stroke:var(--c-core);stroke-opacity:.55}
.node.L-bus.lit .body{fill:color-mix(in srgb,var(--signal) 22%,var(--surface));stroke:var(--signal);stroke-opacity:1}
.buslbl{font-family:var(--font-mono)!important;font-size:8.2px;letter-spacing:.14em;fill:var(--ink-3)!important}
.pulse{fill:var(--signal);filter:var(--glow)}
.cap-q{font-family:var(--font-serif)!important;font-style:italic;font-size:19px}
.cap-k{font-family:var(--font-mono)!important;font-size:9.5px;font-weight:600;letter-spacing:.1em;fill:var(--ink-3)!important}
.cap-l{font-family:var(--font-mono)!important;font-size:10px;fill:var(--ink-2)!important}
.anno{font-size:10.5px;font-stretch:88%;fill:var(--ink-2)!important}
.lock{font-family:var(--font-mono)!important;font-size:8.6px;letter-spacing:.06em;fill:var(--ink-3)!important}
/* run-mode states */
.node.st-pass .body{stroke:var(--go);stroke-width:2;fill:color-mix(in srgb,var(--go) 12%,var(--surface))}
.node.st-unk .body{stroke:var(--c-div);stroke-width:2;fill:color-mix(in srgb,var(--c-div) 13%,var(--surface))}
.node.st-stop .body,.node.st-fail .body{stroke:var(--stop);stroke-width:2.2;fill:color-mix(in srgb,var(--stop) 12%,var(--surface))}
.node.st-blocked .body{stroke:var(--ink-3);stroke-dasharray:4 3;stroke-width:1.6;fill:var(--surface-2)}
.node.st-cap .body{stroke:var(--hold);stroke-width:2.2;fill:color-mix(in srgb,var(--hold) 13%,var(--surface))}
.node.st-pass .tab{fill:var(--go)} .node.st-unk .tab{fill:var(--c-div)} .node.st-stop .tab,.node.st-fail .tab{fill:var(--stop)} .node.st-blocked .tab{fill:var(--ink-3)} .node.st-cap .tab{fill:var(--hold)}
.statebadge{font-family:var(--font-mono)!important;font-size:8.6px;font-weight:600;letter-spacing:.06em}

@media (max-width: 860px){
  .app{gap:8px;padding-block:8px}
  .brand h1{font-size:18px}
  .brand .meta{font-size:10px}
  .mapctl{top:8px;bottom:auto;left:8px}
  .tools .hidepanel{display:none}
  .stage{grid-template-columns:minmax(0,1fr)!important}
  .stage.collapsed .drawer{display:block}
  .drawer{position:absolute;left:0;right:0;bottom:0;max-height:54%;border-radius:12px 12px 0 0;box-shadow:var(--shadow);z-index:4}
  .drawer.min{max-height:46px;overflow:hidden}
  .sheetbar{display:flex;position:sticky;top:0;z-index:2;justify-content:center;background:var(--surface);border-bottom:1px solid var(--line)}
  .sheetbar button{border:0;background:transparent;padding:8px 14px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;width:100%}
  .dz{padding:14px 16px 22px}
  .calc .inputs{grid-template-columns:1fr}
  .hint{display:none}

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const W = 1650, H = 1012;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const F = {
  M:'Residential_Investment_Framework.md',
  SUP:'sop/Approved_Execution_Supplement.md',
  REG:'sop/Founder_QA_Approval_Register.md',
  STD:'execution-release-2026-10-07/Decision_Execution_Standard.md',
  TPL:'execution-release-2026-10-07/Case_Workpaper_Template.md',
  CFG:'execution-release-2026-10-07/financial_config.json',
  P7:'phase-7/Phase_7_SOP_Addendum.md',
  AUD:'Evidence_Judgment_Divergence_Integration_Audit.md'
};
const LAYER_NAME = {in:'01 Input', det:'02 Detect', cell:'02 Detect · polarity', inv:'03 Investigate', bus:'03 → 04 Interpretation', core:'04 Core', gate:'05 Gate', sop:'06 SOP', dec:'07 G9 output', prio:'07 Output', role:'07 Role', lane:'08 Learn'};

/* ------------------------------------------------------------------ nodes */
const N = {}; const ORDER = [];
const COL = {in:{x:32,w:150}, det:{x:238,w:200}, inv:{x:494,w:166}, core:{x:742,w:196}, gate:{x:1018,w:168}, sop:{x:1262,w:182}, dec:{x:1262,w:160}, role:{x:1486,w:140}};
function at(col, cy, h = 22, w, x){ const c = COL[col]; return {x: x ?? c.x, w: w || c.w, h, y: cy - h/2, cy}; }
function add(id, L, o){ const n = Object.assign({id, L}, o); N[id] = n; ORDER.push(id); return n; }

/* 01 Input */
const EV = [
  ['E1','Statutory / official','Statutory and official records',`Evidence order generally: 1. statutory / official; 2. registered transactions; 3. audited / developer documents; 4. JMB / MC evidence; 5. portals; 6. agents; 7. resident / forum / social evidence.`,'Master §23 Evidence Discipline',`Top of the general evidence order. Authority is claim-specific: an issuer report can establish declared completion while remaining insufficient to establish buyer preference (Execution standard §5).`],
  ['E2','Registered transactions','Registered transactions',`Always separate: registered transaction; asking; effective developer price; auction reserve; auction sold; asking rent; achieved rent.`,'Master §23 Evidence Discipline',`The raw material for G0. Repeated rows from one registration feed count once, and aliases need parcel reconciliation (Phase 7 SOP addendum, control 3).`],
  ['E3','Audited / developer docs','Audited and developer documents',`Never call: Developer Price - Acquisition Price a discount automatically.`,'Master §5.30',`Developer headline and the effective package (rebates, furnishing, incentives) are different prices. Headline versus effective consideration is the G0 divergence watchpoint.`],
  ['E4','JMB / MC records','JMB / MC governance records',`Governance records: collection, arrears, audited reserves, committed capex, insurance, enforcement and service continuity.`,'Master · Evidence still required',`Match adverse and remedial evidence to the actual tower, MC, date and scope. Historic awards, old complaints and undated works do not establish current health or failure.`],
  ['E5','Portals','Property portals',`Repeated portal copies do not create independent corroboration.`,'Master §5 Divergence · family A',`Asking prices and listing counts are signals, not clearing prices. A disappeared listing is neither an achieved sale nor a withdrawn thesis (Execution standard §5).`],
  ['E6','Agents','Agents',`Agent contact frequency, public advertising and promotional excitement are weak signals with competing explanations.`,'Execution supplement §7',`Seller urgency can motivate an offer but does not prove undervaluation or a clean transaction.`],
  ['E7','Resident / forum / social','Resident, forum and social evidence',`Mark UNKNOWN where evidence is weak.`,'Master §23 Evidence Discipline',`Last in the general order. Useful as leads on noise, lifts or governance that then need dated, attributable observation. Do not average incompatible evidence.`]
];
EV.forEach((e, i) => add(e[0], 'in', Object.assign(at('in', 112 + i*28), {code:String(i+1), label:e[1], title:e[2], q:e[3], src:e[4], note:e[5], rank:i+1})));
add('F', 'in', Object.assign(at('in', 322), {code:'F', label:'Field & governance packet', title:'Field and governance evidence packet', q:`For each observation retain date, time, location/tower, observer/source, method, observed fact, interpretation, alternative explanation, affected buyer task and affected gate.`, src:'Execution supplement §4', note:`Covers arrival and security, lifts, parking, corridors and refuse, facilities, management response and governance funding. Do not claim a visit, engineering inspection or private-account review that did not occur. An unavailable field item stays unknown and can block a strong unit recommendation. Its stated gate routes are G3/G4 (supplement §4: execute existing G3/G4), G2–G4 and G6 (approval register items 2 and 12) and irreversible field conditions to G4 (supplement §8); the map draws them through the ledger instead of as long links.`}));
add('J', 'in', Object.assign(at('in', 392), {code:'J', label:'Informed judgment', title:'Informed market judgment', q:`Informed Market Judgment = Pattern Recognition + Market Experience + Micro-Market Observation + Comparable Knowledge + Product Understanding + Buyer Behaviour Recognition`, src:'Master §5 Divergence · definition', note:`Intuition may prompt anomaly detection. Instinctive guessing, authority, confidence and personal taste are not substitutes for informed judgment or evidence. Record the experience behind the judgment, attribute practitioner input and separate direct observation from interpretation.`}));

/* 02 Detect */
add('L', 'det', Object.assign(at('det', 190, 40), {code:'L', label:'Claim & comparable ledger', sub:'4 evidence statuses', title:'Claim and comparable ledger', q:`Each material claim carries an ID, proposition, asset scope, buyer/horizon, source link, source origin/lineage, publication/event/retrieval dates, observed text/data, access method, interpretation, adjustment, uncertainty, gate and freshness trigger.`, src:'Execution standard §5', note:`Comparables keep identity, original and effective price, area basis, floor/stack, layout, parking, condition, tenure, motive, event date and inclusion role. Auction reserves, voluntary sales and developer packages are never averaged together; duplicated sources count once.`, list:['Supported','Bounded estimate','Unknown','Contrary evidence'], listTitle:'Evidence annotations (not investment outputs)'}));
add('CHECK', 'det', Object.assign(at('det', 346, 168), {kind:'box', code:'◆', label:'Divergence check', title:'Evidence–Judgment Divergence check', q:`Divergence is a trigger for investigation, not permission to override evidence.`, src:'Master §5 · cross-module decision control', note:`Runs at evidence intake, at each relevant gate, on any material new observation and before G9. A flag is raised only when the gap could materially change valuation, entry decision, required margin of safety, asset ranking, exit liquidity, downside risk or conviction. Positive and negative describe support for one stated proposition, not an asset-wide score. It is an investigation control, not a gate, not a module and not G10.`, listTitle:'Eight automatic comparisons', list:['Quantitative evidence vs qualitative evidence','Historical evidence vs forward-looking market structure','Location strength vs project strength','Rental performance vs owner-occupier desirability','Headline PSF vs true comparable value','Reported liquidity vs real exit buyer depth','Current weakness vs temporary lifecycle distortion','Current strength vs potential structural deterioration']}));
const CB = N.CHECK; // box geometry: x 238..438, y 262..430
const cellW = 84, cellH = 44, cx0 = CB.x + 22, cx1 = cx0 + 88, ry0 = CB.y + 58, ry1 = ry0 + 50;
const CELLS = [
  ['Qpp', cx0, ry0, '+ / +', 'Aligned', 'Evidence aligned', `Continue normal underwriting; alignment does not pass an untested gate`, `Agreement can still reflect shared bias or a shared erroneous source.`, -7],
  ['Qpn', cx1, ry0, '+ / −', 'Structural risk?', 'Possible hidden structural risk', `Trigger Divergence Investigation with at least equal attention; no presumption that the judgment is wrong`, `Positive data, negative judgment. Historical strength may coexist with a future exit-value ceiling, a narrowing buyer pool, resale weakness, owner-occupier resistance, a structural externality or lifecycle deterioration. Good headline metrics cannot average away a critical gate failure; negative judgment alone cannot establish one.`, 7],
  ['Qnp', cx0, ry1, '− / +', 'Mispricing?', 'Possible hidden mispricing', `Trigger Divergence Investigation; no presumption that weak evidence is wrong`, `Weak data, positive judgment. It becomes an investable thesis only if evidence establishes the explanation, a valid clearing and entry basis, the recoverable share, acceptable asset and financing risks, a credible exit and suitable capital allocation. Weak data plus positive conviction is not an investment role.`, -7],
  ['Qnn', cx1, ry1, '− / −', 'Neg. alignment', 'Negative alignment', `Usually reject / deprioritise; use G9 Reject only for an established structural Gate failure, otherwise retain the applicable existing decision`, `Negative alignment does not invent a structural failure.`, 7]
];
CELLS.forEach(c => add(c[0], 'cell', {kind:'cell', x:c[1], y:c[2], w:cellW, h:cellH, cy:c[2] + cellH/2, code:c[3], label:c[4], title:c[5], q:c[6], src:'Master §5 Divergence · four-state logic', note:c[7] + ` Rows read observed evidence; columns read informed judgment.`, portX:CB.x + CB.w, portY:c[2] + cellH/2 + c[8]}));
add('UNK', 'det', Object.assign(at('det', 458), {code:'?', label:'Unclassified · UNKNOWN', title:'Unknown evidence stays unclassified', q:`Unknown evidence or unsupported judgment remains explicitly unclassified until interpretable; do not create a false positive/negative label to fill the table.`, src:'Master §5 Divergence · four-state logic', note:`Missing or weak evidence is UNKNOWN, not automatically Negative, and absence alone does not invent a conflict. The ordinary gate stop is kept and the case goes back to the ledger for the specified evidence. An independent material qualitative observation can still trigger investigation when the quantitative series is incomplete.`}));

/* 03 Investigate */
add('A', 'inv', Object.assign(at('inv', 262, 24), {code:'A', label:'Data limitation', title:'A — Data limitation', q:`Retain the original observations, record proposed exclusions/adjustments and trace source lineage.`, src:'Master §5 Divergence · family A', note:`Correct a measurement problem only with an evidenced reason, then rerun the affected gate. A corrected dataset is not automatically evidence of undervaluation.`, listTitle:'Test for', list:['transaction-data lag, low volume, small samples','poor or non-like-for-like comparables','lifecycle effects and VP-stage distortion','temporary supply release','unrecorded incentives, developer rebates, furnishing packages','aggregation error and stale asking prices','valuation lag and incomplete rental evidence','unusual seller composition']}));
add('B', 'inv', Object.assign(at('inv', 294, 24), {code:'B', label:'Judgment bias', title:'B — Judgment bias', q:`State the strongest rival account and what would cause withdrawal of the preferred interpretation.`, src:'Master §5 Divergence · family B', note:`Actively try to falsify your own preferred explanation and apply the same burden to attractive and unattractive conclusions. Research effort, ownership, prior endorsement or practitioner seniority cannot lower it. Do not ask a practitioner for the desired conclusion before forming an independent view.`, listTitle:'Test for', list:['ownership bias and anchoring','confirmation, familiarity and recency bias','narrative attachment','personal lifestyle or aesthetic preference','sunk-cost thinking','the wish to justify a predetermined entry price']}));
add('C', 'inv', Object.assign(at('inv', 326, 24), {code:'C', label:'Omitted variable', title:'C — Omitted variable', q:`Specify how the variable could change actual buyer behaviour, utility, financeability, clearing price or exit. Describing an attractive feature is insufficient.`, src:'Master §5 Divergence · family C', note:`Test the variable's incremental explanation against true substitutes and existing Core mechanisms. Do not invent a weight or a universal screening rule.`, listTitle:'Candidate variables', list:['owner-occupier desirability, buyer-pool depth, tenant profile','product positioning, layout efficiency, privacy','lift performance, circulation, drop-off, parking usability','management and maintenance quality','noise, view, pedestrian environment, retail interface','neighbourhood perception, external negative adjacency','financing constraints','supply composition and competing future supply','micro-location access, catalyst recognition','social / prestige signalling, functional substitution set']}));
add('D', 'inv', Object.assign(at('inv', 358, 24), {code:'D', label:'Structural change', title:'D — Structural change not yet in the data', q:`Equally, announced change is not delivered utility or demonstrated buyer willingness-to-pay.`, src:'Master §5 Divergence · family D', note:`Historical data is not automatically forward-looking truth. Distinguish proposed, funded, under-construction, operating and adopted stages, verify transmission to the selected asset and future buyer, and test delay, non-delivery, competing supply and whether the change is already priced in.`, listTitle:'Test for', list:['new infrastructure or changed accessibility','emerging employment nodes, new commercial ecosystem','changing resident demographics, neighbourhood upgrading','supply exhaustion, regeneration, planning changes','new buyer pool, changed financing conditions','post-VP normalisation, stigma recovery','improved management, major amenity completion']}));
add('H', 'inv', Object.assign(at('inv', 420, 30), {code:'H', label:'Falsifiable hypothesis', title:'Convert judgment into a falsifiable hypothesis', q:`Do not retain “I feel this project is undervalued” or “The project does not feel right” as the explanation.`, src:'Master §5 Divergence · hypothesis', note:`Evidence should discriminate between rival explanations, not repeat the original observation. Predeclare tests where feasible and record later amendments instead of moving the goalposts. Each active case carries at most three immediate decision-changing unknowns (Execution standard §6).`, listTitle:'Specify before interpreting', list:['the exact proposition and preferred explanation','the causal link to an existing mechanism, with scope and horizon','expected confirming observations against a baseline or substitutes','expected falsifying observations and the strongest rival','evidence to obtain, its source and independence','measurement period, event trigger or review deadline','decision consequence if confirmed, falsified or unresolved']}));
add('S', 'inv', Object.assign(at('inv', 478, 34), {code:'S', label:'Flag status', sub:'resolved/partial/unresolved', title:'Flag status', q:`Resolution may establish a bad investment; it is not a synonym for Deploy.`, src:'Master §5 Divergence · decision precedence', note:`Review at G9 and on material new evidence, and reopen a resolved flag when its premise stops holding. Elapsed time, a favourable price move, user agreement or analyst confidence never closes a flag. Status is reviewed at G9; the map draws that link through the margin node.`, listTitle:'Three statuses', list:['Resolved: discriminating evidence validates or rejects the explanation; the finding is routed and decisions are re-evaluated','Partially resolved: unresolved components are listed and keep a higher proof and safety burden','Unresolved: lower conviction, seek the specified evidence, preserve the affected gate stop']}));
add('R', 'inv', Object.assign(at('inv', 540, 30), {code:'→', label:'Route to existing Core', title:'Route the finding to an existing Core mechanism', q:`Intuition detects anomaly. Existing Core mechanisms explain anomaly. Evidence validates or rejects the explanation.`, src:'Master §5 Divergence · routing', note:`Never leave intuition as a standalone residual explanation. Multiple routes are allowed when evidence supports each causal link, without counting one benefit or risk twice. If no existing mechanism explains the claim, it stays outside Core as an unvalidated candidate under the unchanged promotion threshold.`}));
add('M', 'inv', Object.assign(at('inv', 600, 30), {code:'M', label:'Margin of safety ↑', title:'Unresolved divergence raises the required margin', q:`Unresolved Divergence → Higher Uncertainty → Higher Required Margin of Safety → Lower Position Conviction → More Evidence Required`, src:'Master §5 Divergence · unresolved treatment', note:`Record the extra protection against the no-divergence case without a universal haircut or conviction score. If normalised clearing is unknown, say the margin cannot yet be quantified. A lower offered price, smaller position or larger reserve cannot cure an unpassed critical gate.`}));

/* Bus */
add('BUS', 'bus', {kind:'bus', x:712, w:12, y:96, h:810, cy:501, code:'', label:'Interpretation bus', title:'Interpretation through existing Core mechanisms', q:`Evidence → Divergence Check → Interpretation → Existing Core Mechanisms → Investment Decision`, src:'Master §5 · cross-module decision control', note:`Every aligned reading and every supported finding is interpreted through the 35 frozen principles. The bus is this map's drawing device for that step; it is not a module in the framework.`});

/* 04 Core */
const CORE = {
  1:['Context-adaptive factors','Context-Adaptive Factor Importance',`Factor Importance = f(Context, Buyer, Product, Lifecycle)`,`No universal weights. A factor can act as a Driver, Gate, Floor, Ceiling or Modifier. A failed critical Gate cannot be averaged away by many positives.`],
  2:['Value causal chain','Property Value Causal Chain',`Location + Product Positioning -> Resident Profile -> Governance / Management -> Lived Environment -> Resale Reputation -> Price Stability / Appreciation`,`Immutable design matters: lift ratio, circulation, parking, drop-off, refuse, loading, noise, layout, privacy. Management can preserve or destroy premium but cannot turn an ordinary area into a premium address by itself.`],
  3:['Premium as revealed preference','Premium / Vibe as Revealed Preference',`"Vibe" can be economically real if it repeatedly changes willingness-to-pay.`,`Look for repeated higher benchmarks, take-up despite cheaper substitutes and post-completion persistence. Separate durable premium from launch hype. Buyer breadth and buyer depth are different.`],
  4:['Identity → buyer depth','Demographic / Identity Orientation',`Do not treat ethnicity as intrinsic value.`,`Translate it into buyer-pool depth, purchasing power, community network, commercial and social ecosystem, location loyalty, intergenerational attachment and cross-segment acceptance.`],
  5:['Location-first demand','Intergenerational / Location-First Demand',`Need real evidence of housing-form adoption.`,`Do not assume landed loyalty becomes strata loyalty, one generation becomes another, or local wealth becomes condo demand.`],
  6:['Township maturity','Township Maturity',`First High-Rise = Market Experiment, not Township Maturity`,`Maturity needs multiple vertical generations, stable secondary demand, local household adoption and repeated resale acceptance. Launch acceptance alone is not structural maturity.`],
  7:['Master developer ecosystem','Master Developer / Curated Ecosystem',`Premium Persistence != Premium Growth`,`Master developers shape launch timing, supply, tenant and commercial mix, placemaking and absorption. Once land and catalysts mature, premium may persist while appreciation slows.`],
  8:['Effective competing supply','Supply',`Do not count all nearby units as equal competitors.`,`Use effective competing or core-substitutable supply. New phases can raise the benchmark, cannibalise old stock or segment buyer pools.`],
  9:['Premium formation / overheat','Premium Formation / Overheat',`Warning sign: all catalyst-linked projects are chased indiscriminately.`,`Healthy premium markets still discriminate between good, average and bad. Catalysts create demand and also narratives.`],
  10:['Dynamic price ceiling','Dynamic Price Ceiling',`Capital Appreciation Ceiling_t = Future Reference Set_t + Prime Scarcity Premium_t + Durable Consensus Premium_t - Structural Penalty_t`,`The current reference set is not the future one, and absolute quantum matters: what else can the buyer get for the same total budget? Core notation is explanatory unless a workpaper supplies measurable variables (Execution standard §8).`],
  11:['PSF vs absolute quantum','PSF vs Absolute Quantum',`Price Ceiling = Next Best Use of Buyer's Budget`,`Small units can carry high PSF while staying under budget thresholds. Do not infer premium from PSF alone.`],
  12:['Small-unit compression','Small-Unit / Affordable-Aspirational Compression',`But once copied, smallness is not alpha.`,`Young buyers may accept less space for location, design, convenience, furnishing or access. Compare one-, two- and three-bedroom products where buyer tasks overlap; family-sized stock is not the default definition of investable owner appeal (Execution supplement §3).`],
  13:['TOD: friction vs penalty','TOD: Access Friction vs Residential Penalty',`A 300–500m low-friction / low-penalty product may beat a noisy 100m product.`,`Access friction (walking time, crossings, weather, vertical circulation, uncertainty) is separate from residential penalty (noise, vibration, crowding, traffic, privacy, blocked view).`],
  14:['Permanent externalities','Permanent Externalities',`These can cap terminal value, especially in: owner-occupier dominant; higher price; prestige-sensitive markets.`,`Examples: petrol station, STP, high-voltage tower, substation, industrial or waste use, highway noise, cemetery.`],
  15:['Operational livability','Operational Livability',`Separate: launch appeal; lived experience.`,`Evaluate lift congestion, parking circulation, drop-off, visitor parking, parcels and loading, refuse, security, facility crowding and delivery flow.`],
  16:['Low density / tenure','Low Density / Tenure',`Low density is not automatically premium.`,`It can create privacy but also high service charges, facility inefficiency and weak activation. Freehold premium is contextual, not universal.`],
  17:['Urban renewal','Urban Renewal',`Area Renewal != Automatic Old-Stock Rerating`,`Old stock benefits only through redevelopment or land optionality, exceptional survivability, measurable utility transmission or buyer-reference transmission.`],
  18:['Destination vs daily anchor','Destination vs Daily-Living Anchor',`Destination anchors create buzz. Daily-life / economic anchors create repeated utility.`,`Residential premium depends more on resident utility frequency, recurring convenience and economic relevance.`],
  19:['Project vs address premium','Project Premium vs Address Premium',`"I want this project here" != "I want this area"`,`A developer can create a premium enclave. A mature address lets several decent developers sell near a shared baseline.`],
  20:['Newness premium decay','Newness Premium Decay / Convenience Reversion',`As newness fades, utility matters more.`,`Newness can temporarily hide inconvenience, weak access, a poor area or operating friction.`],
  21:['Scarcity','Scarcity',`Demand Wants It + Supply Is Insufficient`,`Scarcity only matters when both hold. Distinguish desirable scarcity from buyer scarcity.`],
  22:['Investor vs owner-occupier','Investor vs Owner-Occupier Positioning',`Airbnb ban alone does not prove owner occupation.`,`Positioning is shaped by layout, quantum, density, target buyer, rules and resident profile.`],
  23:['Liquidity','Liquidity',`Liquidity is real investment value.`,`Do not reduce all investment quality to rerating. A mature high-liquidity asset can be a valid Preservation, Liquidity or Defensive Utility trade.`],
  24:['Reference-set migration','Reference-Set Migration',`Future premium comps require a credible migration bridge.`,`Possible path: commercial repositioning → tenant profile shift → selected new-project repricing → partial old-stock spillover → district reclassification.`],
  25:['Management / governance','Management / Governance',`Strong location cannot fully immunise poor governance.`,`Management preserves or destroys project premium. The SOP management stress test supplies the severity ladder.`],
  26:['Dynamic comparable mapping','Dynamic Comparable Mapping',`Would the actual buyer realistically compare these two on the same weekend?`,`Comparable universe = substitution set + exit set, sorted into primary, secondary, diagnostic and rejected comps, with roles such as anchor, floor, ceiling, switch-price, landed substitute, migration bridge and future exit. Current comp set is not the future comp set.`],
  27:['Buyer-pool transfer: not proven','Buyer Pool Transfer — Default NOT PROVEN',`Cross-housing-form transfer defaults to zero until proven.`,`No automatic transfer from landed to strata, project to project, developer to developer or enclave to enclave. "Not proven" means no underwriting credit yet, not proof that transfer is impossible (Execution standard §8).`],
  28:['Lifecycle ≠ price recognition','Lifecycle Stage != Price Recognition Stage',`What part of the future am I already paying for today?`,`Price-recognition states: under-recognised, fairly recognised, future-priced, overextended.`],
  29:['Thesis–expression / no trade','Thesis–Expression / No Trade',`Correct Market Thesis != Correct Investment Expression`,`Expressions: new launch, first resale, mature secondary, distressed or auction, bridge asset, a specific tower, layout or stack, or no trade. No Trade can be the best decision. Routing row 2 (mispricing and reversible discount) runs G0–G5 and then G6–G9; the map draws only that row's G0 and G5 links to keep the chain readable.`],
  30:['Reference-price validity','Reference-Price Validity / Clearing Price',`Validated Discount = Normalised Clearing Price - Acquisition Price`,`Separate developer, effective developer, secondary clearing, auction reserve, auction sold and asking prices, and establish the normalised clearing price first. Then Recoverable Discount = Validated Discount × Reversible Share. "Price history doesn't create value. Buyer depth creates value." Routing row 2 runs G0–G5 and then G6–G9; the map draws only its G0 and G5 links.`],
  31:['Own-stay vs multi-anchor','Pure Own-Stay vs Multi-Anchor Location Demand',`A wealthy landed area may be valuable because residents want landed housing, not because the location supports all housing forms.`,`Anchors may include employment, education, healthcare, commercial, transport, lifestyle, community and prestige.`],
  32:['Transmission required','Second-Order Beneficiary Requires Transmission',`Proximity alone is not enough.`,`Nearby improvement re-rates old stock only through utility transmission or buyer-reference transmission.`],
  33:['Aggregate ≠ unified pool','Aggregate Demand != Unified Buyer Pool',`Aggregate Area Demand = Σ Project-Specific Buyer Pools`,`Area liquidity is a demand reservoir. It does not prove project interchangeability. Overlapping pools are not summed as independent people (Execution standard §8).`],
  34:['Usage ≠ ownership premium','Usage Demand != Ownership Premium',`High Utility + Strong Rent + Weak Ownership Aspiration`,`Strong occupancy, rent, commuting and tenant demand do not automatically create high capital pricing.`],
  35:['Demand-source decomposition','Location-Demand Source Decomposition',`Then ask what each supports: usage; rent; ownership; liquidity; premium; rerating.`,`Sources include employment, schools, universities, healthcare, retail, transport, centrality, family and social networks, lifestyle, prestige, housing-form scarcity and intergenerational attachment.`]
};
const CLUSTERS = [
  ['Price & reference',[30,11,10,12]],
  ['Catalysts & change',[7,17,18,24,32]],
  ['Lifecycle & recognition',[6,20,28]],
  ['Supply & comparables',[8,21,26]],
  ['Buyers & demand',[4,5,31,35,22,27,33,34]],
  ['Value & premium',[1,2,3,9,19]],
  ['Product · ops · externalities',[13,14,15,16,25]],
  ['Liquidity & expression',[23,29]]
];
const GROUPHEADS = [];
{
  let y = 100;
  CLUSTERS.forEach(([name, ids]) => {
    GROUPHEADS.push({x: COL.core.x + 2, y: y + 9, t: name});
    y += 14;
    ids.forEach(k => {
      const c = CORE[k];
      add('c' + k, 'core', Object.assign(at('core', y + 9, 17), {code:'5.' + k, label:c[0], title:'5.' + k + ' ' + c[1], q:c[2], src:'Master §5.' + k, note:c[3], cluster:name}));
      y += 19;
    });
    y += 3;
  });
}

/* 05 Gates */

let pulseEdges = [], pulses = [], praf = 0, lastSpawn = -1e9;
function setPulses(list){
  pulses.forEach(p => p.c.remove()); pulses = []; pulseEdges = [];
  if (reduceMotion || !list.length) { cancelAnimationFrame(praf); praf = 0; return; }
  pulseEdges = list; pulseEdges.forEach(e => { if (!e.len) e.len = e.p.getTotalLength(); });
  lastSpawn = -1e9; if (!praf) praf = requestAnimationFrame(tickPulse);
}
function tickPulse(t){
  if (t - lastSpawn > 1100) {
    lastSpawn = t;
    pulseEdges.forEach((e, i) => { if (pulses.length < 80) pulses.push({c:el('circle', {r:2.4, class:'pulse', cx:-99, cy:-99}, gPulse), e, t0:t + (i % 6) * 70, dur:700 + e.len * 2.4}); });
  }
  pulses = pulses.filter(p => {
    const u = (t - p.t0) / p.dur;
    if (u >= 1) { p.c.remove(); return false; }
    if (u < 0) return true;
    const pt = p.e.p.getPointAtLength(u * p.e.len);
    p.c.setAttribute('cx', pt.x.toFixed(1)); p.c.setAttribute('cy', pt.y.toFixed(1)); p.c.setAttribute('opacity', Math.sin(Math.PI * u).toFixed(2));

}

  if (focus) {
    const {lv} = activation(id);
    const ids = [...lv.entries()].filter(([, v]) => v >= 0.85).map(([k]) => k).filter(k => N[k].L !== 'bus');
    intent = {type:'nodes', ids: ids.length > 1 ? ids : [id], maxK:1.15}; applyIntent();
  }
}
function clearSelection(){ if (mode !== 'explore') return; selected = null; drawOverview(); paint(); }

/* play */
let playTimer = 0; const playBtn = $('#playBtn');
function stopPlay(){ clearInterval(playTimer); playTimer = 0; playBtn.textContent = 'Play'; playBtn.setAttribute('aria-pressed', 'false'); }
playBtn.addEventListener('click', () => {
  if (playTimer) { stopPlay(); return; }
  if (mode !== 'walk' || stepIdx === STEPS.length - 1) goStep(0); else goStep(stepIdx);
  playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'true');
  playTimer = setInterval(() => { if (stepIdx >= STEPS.length - 1) { stopPlay(); return; } goStep(stepIdx + 1); }, 7000);
});

/* panel / sheet */
const toggleBtn = $('#togglePanel');
toggleBtn.addEventListener('click', () => {
  const c = stageEl.classList.toggle('collapsed');
  toggleBtn.textContent = c ? 'Show panel' : 'Hide panel'; toggleBtn.setAttribute('aria-pressed', String(c));
});
const sheetToggle = $('#sheetToggle');
function openSheet(){ drawer.classList.remove('min'); sheetToggle.textContent = 'Hide details'; sheetToggle.setAttribute('aria-expanded', 'true'); }
sheetToggle.addEventListener('click', () => {
  const m = drawer.classList.toggle('min');
  sheetToggle.textContent = m ? 'Show details' : 'Hide details'; sheetToggle.setAttribute('aria-expanded', String(!m));
  applyIntent(250);
});

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (e.key === 'Escape') { if (mode === 'explore') clearSelection(); }
  else if (mode === 'walk' && e.key === 'ArrowRight') goStep(stepIdx + 1);
  else if (mode === 'walk' && e.key === 'ArrowLeft') goStep(stepIdx - 1);
  else if (e.key === '+' || e.key === '=') $('#zoomIn').click();
  else if (e.key === '-') $('#zoomOut').click();
  else if (e.key === '0') $('#zoomFit').click();
});

/* boot */
drawOverview();
paint();
requestAnimationFrame(() => applyIntent(0));
fitText();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitText(); });
})();
</script>
</body>
